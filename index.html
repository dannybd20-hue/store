<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>החנות של אפריים בן דוד</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#10263A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="החנות">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Heebo:wght@500;700;800&family=Frank+Ruhl+Libre:wght@700&display=swap">
<style>
/* Layout: dark petrol masthead, quiet neutral canvas, product tiles with a crisp price label; one emerald accent for actions */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#111827; --muted:#667085; --line:#E4E7EC; --line2:#D0D5DD;
  --brand:#10263A; --brand-ink:#FFFFFF; --accent:#0B7A63; --accent-ink:#FFFFFF; --accent-soft:#E7F4F0;
  --gold:#B8893A; --wa:#1F9D55; --danger:#C2362F; --warn:#B4690E; --info:#2F5D8A;
  --t0:#EEF2F6; --t1:#F2EFE9; --t2:#EAF2EF; --t3:#F3EEEA; --t4:#ECEFF6; --t5:#F1EDF4;
  --k0:#2F5D8A; --k1:#8A6A2F; --k2:#0B7A63; --k3:#9A5B3B; --k4:#4B5B8C; --k5:#6E4E86;
  --display:"Heebo","Assistant",system-ui,sans-serif;
  --serif:"Frank Ruhl Libre","Times New Roman",serif;
  --body:"Assistant","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141B; --card:#161E27; --ink:#E9EDF2; --muted:#98A2B3; --line:#243040; --line2:#33414F;
  --brand:#0A1A28; --accent:#2BB592; --accent-ink:#04211A; --accent-soft:#12302A;
  --gold:#D6A955; --wa:#2DBE6C; --danger:#F06A60; --warn:#E39B3E; --info:#7FA8D4;
  --t0:#1B2531; --t1:#24211C; --t2:#17262A; --t3:#26201D; --t4:#1C2232; --t5:#221D2A;
  --k0:#7FA8D4; --k1:#D6B36F; --k2:#2BB592; --k3:#D9906B; --k4:#93A3D6; --k5:#B597CF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141B; --card:#161E27; --ink:#E9EDF2; --muted:#98A2B3; --line:#243040; --line2:#33414F;
  --brand:#0A1A28; --accent:#2BB592; --accent-ink:#04211A; --accent-soft:#12302A;
  --gold:#D6A955; --wa:#2DBE6C; --danger:#F06A60; --warn:#E39B3E; --info:#7FA8D4;
  --t0:#1B2531; --t1:#24211C; --t2:#17262A; --t3:#26201D; --t4:#1C2232; --t5:#221D2A;
  --k0:#7FA8D4; --k1:#D6B36F; --k2:#2BB592; --k3:#D9906B; --k4:#93A3D6; --k5:#B597CF; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1.25;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.demo{background:var(--t1);color:var(--ink);font-size:13px;border-bottom:1px solid var(--line)}
.demo .wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:7px}
.demo b{margin-inline-end:auto;font-weight:600;color:var(--k1)}
.demo button{border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:3px 10px;cursor:pointer;font-weight:600}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:8px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;margin-inline-end:auto;min-width:0}
.brand h1{font:700 clamp(17px,4.4vw,21px)/1.2 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.logo{width:38px;height:38px;border-radius:8px;background:#fff;object-fit:contain;flex:none}
.logo.ph{display:grid;place-items:center;color:var(--brand);font:700 20px var(--serif);background:#fff}
.hbtn{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.08)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:8px;padding:10px 16px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink);transition:background .15s,box-shadow .15s}
.btn:hover{filter:brightness(1.05)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.full{width:100%}
.btn.soft{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.soft:hover{border-color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line2)}
.btn.wa{background:var(--wa);color:#fff}
.btn.teal,.btn.grape,.btn.orange{background:var(--accent);color:var(--accent-ink)}
.btn.sky{background:var(--ink);color:var(--bg)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 12px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

label.f{display:grid;gap:6px;font-weight:600;font-size:14px;color:var(--ink)}
input.i,select.i,textarea.i{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:10px 12px;font-weight:400;font-size:16px;transition:border-color .15s,box-shadow .15s}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);outline:none}
textarea.i{min-height:76px;resize:vertical}
.err{background:color-mix(in srgb,var(--danger) 10%,var(--card));color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 30%,transparent);border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px}

.auth{min-height:100vh;display:grid;place-items:center;padding-block:40px;background:linear-gradient(var(--brand) 0 230px,var(--bg) 230px)}
.auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:grid;gap:16px;box-shadow:0 24px 48px -24px rgba(16,38,58,.35)}
.auth-head{display:grid;justify-items:center;gap:6px;text-align:center}
.auth-head .logo{width:60px;height:60px;border-radius:12px;border:1px solid var(--line)}
.auth-head .logo.ph{font-size:30px;color:var(--brand)}
.auth-head h1{font:700 26px/1.2 var(--serif);color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:8px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.link{background:none;border:0;color:var(--info);font-weight:600;cursor:pointer;padding:0;font-size:14px}
form.stack{display:grid;gap:14px}

.center{min-height:70vh;display:grid;place-items:center;text-align:center;padding-block:40px}
.center .box{display:grid;gap:12px;justify-items:center;max-width:420px}
.bubble{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}

.hello{padding-block:22px 4px;display:grid;gap:2px}
.hello h2{font-size:24px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:12px 16px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line2);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer;background:var(--card);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.catbar{display:flex;align-items:center;gap:14px;padding-block:12px 16px}
.catbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:0;flex:1;max-width:340px;text-align:right}
.catbtn b{font-weight:700;margin-inline-end:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catbtn span{font-size:14px}
.catlist{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.catopt{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:var(--card);padding:14px 16px;font-weight:600;font-size:16px;cursor:pointer;text-align:right}
.catopt:last-child{border-bottom:0}
.catopt.on{background:var(--accent-soft);color:var(--accent)}
.catopt.on .muted{color:var(--accent)}
.grid,.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding-bottom:120px}
.plist{padding-bottom:40px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.pc:hover{box-shadow:0 6px 18px -10px rgba(16,24,40,.25)}
.pc.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pc .tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.pc .tap:active{opacity:.85}
.qbadge{position:absolute;z-index:2;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(.96)}100%{transform:scale(1)}}
.pc.bump{animation:pop .22s ease-out}
.ph{position:relative;aspect-ratio:1;max-width:100%;display:grid;place-items:center;border-bottom:1px solid var(--line)}
.ph{overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.noimg{font:700 40px var(--serif);opacity:.55}
.tag{position:absolute;z-index:1;bottom:8px;right:8px;background:var(--card);color:var(--ink);font-weight:800;font-size:15px;padding:3px 9px;border-radius:6px;font-variant-numeric:tabular-nums;box-shadow:0 1px 3px rgba(16,24,40,.18)}
.badge-cat{position:absolute;z-index:1;top:8px;left:8px;font-size:11px;font-weight:700;letter-spacing:.03em;color:#fff;padding:2px 8px;border-radius:4px}
.pb{padding:12px 12px 2px;display:grid;gap:2px;flex:1;min-width:0}
.pb h3{font-size:16px;font-weight:600}
.pb p{margin:0;font-size:13px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pq{padding:10px 12px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.qb{width:34px;height:34px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-size:19px;font-weight:700;cursor:pointer;line-height:1}
.qb.minus{background:var(--card);color:var(--ink);border-color:var(--line2)}
.qn{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.empty{background:var(--card);border:1px dashed var(--line2);border-radius:var(--r);padding:40px 20px;text-align:center;display:grid;gap:8px;justify-items:center;grid-column:1/-1}
.empty h3{font-size:18px}

.bar{position:fixed;bottom:0;left:0;right:0;z-index:25;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-top:12px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.bar .wrap{display:flex}
.bar .btn{flex:1;justify-content:space-between;padding:13px 18px;font-size:16px;border-radius:10px}
.count{background:rgba(255,255,255,.2);border-radius:6px;min-width:26px;height:26px;display:inline-grid;place-items:center;padding:0 7px;font-variant-numeric:tabular-nums}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,20,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:20px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:20px}
.x{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:8px;font-size:18px;cursor:pointer;color:var(--muted)}
.line{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding-block:10px;border-bottom:1px solid var(--line)}
.line img,.line .th{width:48px;height:48px;border-radius:8px;object-fit:cover;display:grid;place-items:center;font:700 20px var(--serif)}
.line .nm{min-width:0}
.line .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:flex;align-items:center;gap:8px}
.mini .qb{width:28px;height:28px;font-size:16px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;font-weight:700}
.total .big{font:800 26px var(--display)}

.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{flex:none;border:0;border-bottom:2px solid transparent;background:transparent;padding:12px 14px;font-weight:600;cursor:pointer;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:-1px}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{background:var(--accent);color:var(--accent-ink);border-radius:99px;padding:0 7px;font-size:12px;line-height:18px;font-variant-numeric:tabular-nums}
.sec-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding-block:20px 14px}
.sec-h h2{font-size:22px}
.sec-h .chip{padding:5px 12px}
.cubes{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding-bottom:40px}
.cube{border:1px solid var(--line);text-align:right;background:var(--card);border-radius:var(--r);padding:16px;display:grid;gap:10px;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.cube:hover{border-color:var(--line2);box-shadow:0 6px 18px -10px rgba(16,24,40,.25)}
.cube-top,.cube-bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cube-top b{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cube-bot{padding-top:10px;border-top:1px solid var(--line)}
.cube-bot b{font:800 20px var(--display)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 16px var(--display);flex:none}
.pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap;border:1px solid}
.pill.new{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.pill.priced,.pill.approved{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent);background:var(--accent-soft)}
.pill.pending{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 8%,var(--card))}
.pill.rejected{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 8%,var(--card))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.panel h2{font-size:18px}
.detail{display:grid;gap:16px;grid-template-columns:1.5fr 1fr;align-items:start;padding-bottom:40px}
@media (max-width:760px){.detail{grid-template-columns:1fr}}
.who{display:flex;gap:12px;align-items:center}
.who .av{width:46px;height:46px;font-size:20px}
.who h2{font-size:20px!important}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:15px}
.kv span:nth-child(odd){color:var(--muted)}
.sel{user-select:all}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px}
table.t th{text-align:right;font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line2);background:var(--bg)}
table.t td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td.n{white-space:nowrap}
.tp{display:flex;gap:10px;align-items:center}
.tp b{font-weight:600}
.tp img,.tp .th{width:38px;height:38px;border-radius:6px;object-fit:cover;flex:none;display:grid;place-items:center;font:700 16px var(--serif)}
.final{border-radius:8px;padding:14px 16px;background:var(--accent-soft);display:flex;justify-content:space-between;align-items:baseline;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}
.final b{font:800 26px var(--display);color:var(--accent)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pa{padding:8px 12px 12px;display:flex;gap:6px}
.pa .btn{flex:1}
.imgpick{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center}
.imgpick .prev{width:88px;height:88px;border-radius:10px;background:var(--bg);border:1px dashed var(--line2);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;text-align:center}
.imgpick .prev img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ulist{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:24px;overflow:hidden}
.urow{padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.urow:last-child{border-bottom:0}
.urow .info{flex:1;min-width:180px;display:grid}
.urow .info b{font-weight:600}
.confirm{background:color-mix(in srgb,var(--danger) 7%,var(--card));border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);border-radius:8px;padding:12px;display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:8px;font-weight:600;font-size:15px;z-index:60;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.myo{display:grid;gap:12px;padding-bottom:40px}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.oitems{font-size:14px;color:var(--muted)}
.note{background:var(--t1);color:var(--ink);border-radius:8px;padding:11px 13px;font-size:15px;border:1px solid var(--line)}
.spin{width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* compact tiles on phones */
@media (max-width:560px){.grid,.plist{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .pb{padding:8px 8px 0}.pb h3{font-size:14px;line-height:1.3}.pb p{display:none}
  .pq{padding:6px 8px 8px}.pq .btn{padding:5px 6px;font-size:13px}
  .qb{width:28px;height:28px;font-size:16px;border-radius:7px}.qn{font-size:15px}
  .tag{font-size:13px;padding:2px 6px;bottom:6px;right:6px}.badge-cat{display:none}.noimg{font-size:30px}
  .pa{padding:6px 8px 8px}}
@media (max-width:340px){.grid,.plist{grid-template-columns:1fr 1fr}}

/* PDF sheet (rendered off screen, fixed light palette for print) */
#pdfHost{position:fixed;left:-10000px;top:0;width:794px;pointer-events:none}
.pdf{width:794px;background:#fff;color:#111827;font-family:var(--body);direction:rtl}

function compress(file, max = 640, type = "image/jpeg") {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        const x = c.getContext("2d");
        if (type === "image/jpeg") { x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL(type, 0.75));
      };
      img.onerror = () => rej(new Error("הקובץ הזה אינו תמונה"));
      img.src = r.result;
    };
    r.onerror = () => rej(new Error("לא הצלחתי לקרוא את הקובץ"));
    r.readAsDataURL(file);
  });
}

function demoBackend() {
  const KEY = "mechiron-demo-v1";
  let mem;
  try { mem = JSON.parse(localStorage.getItem(KEY)); } catch (e) { mem = null; }
  if (!mem || !mem.users) mem = demoSeed();
  const subs = new Set();
  const emit = () => { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} subs.forEach(f => f()); };
  const sub = fn => { subs.add(fn); setTimeout(fn, 0); return () => subs.delete(fn); };
  const nid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36);
  const list = o => Object.entries(o).map(([id, v]) => ({ id, ...v }));
  const findUser = email => Object.entries(mem.users).find(([, u]) => u.email === String(email).trim().toLowerCase());
  let authCb = null;
  const fireAuth = () => { if (!authCb) return; const u = mem.users[mem.session]; authCb(u ? { uid: mem.session, name: u.name, email: u.email, phone: u.phone, status: isAdminEmail(u.email) ? "approved" : u.status, isAdmin: isAdminEmail(u.email) } : null); };
  subs.add(fireAuth);
  return {
    onAuth(cb) { authCb = cb; setTimeout(fireAuth, 0); },
    async signUp({ name, email, phone, password }) {
      email = email.trim().toLowerCase();
      if (findUser(email)) throw new Error("האימייל הזה כבר רשום. נסו להתחבר.");
      if (password.length < 6) throw new Error("הסיסמה צריכה לפחות 6 תווים");

      mem.session = id; emit();
    },
    async signIn(email, password) { const e = findUser(email); if (!e || e[1].password !== password) throw new Error("אימייל או סיסמה שגויים"); mem.session = e[0]; emit(); },
    async signOut() { mem.session = null; emit(); },
    async reset() { throw new Error("במצב הדגמה לא נשלחים מיילים"); },
    loginAs(email) { const e = findUser(email); if (e) { mem.session = e[0]; emit(); } },
    resetAll() { mem = demoSeed(); emit(); },
    watchProducts: cb => sub(() => cb(list(mem.products).sort((a, b) => a.createdAt - b.createdAt))),
    async saveProduct(p) { const { id, ...d } = p; const k = id || nid(); mem.products[k] = { ...(mem.products[k] || { createdAt: Date.now() }), ...d }; emit(); },
    async deleteProduct(id) { delete mem.products[id]; emit(); },
    watchUsers: cb => sub(() => cb(list(mem.users).map(({ password, ...u }) => u))),
    async setUserStatus(id, status) { mem.users[id].status = status; emit(); },

/* ---------- Firebase backend ---------- */
async function firebaseBackend(cfg) {
  const base = "https://www.gstatic.com/firebasejs/10.12.2/";
  const [appM, authM, fs] = await Promise.all(["firebase-app.js", "firebase-auth.js", "firebase-firestore.js"].map(f => import(base + f)));
  const app = appM.initializeApp(cfg), auth = authM.getAuth(app), db = fs.getFirestore(app);
  const col = n => fs.collection(db, n), doc = (n, id) => fs.doc(db, n, id);
  const snapList = (q, cb) => fs.onSnapshot(q, s => cb(s.docs.map(d => ({ id: d.id, ...d.data() }))), e => { console.warn(e); cb([]); });
  let profUnsub = null;
  return {
    onAuth(cb) {
      authM.onAuthStateChanged(auth, u => {
        if (profUnsub) { profUnsub(); profUnsub = null; }
        if (!u) return cb(null);
        const admin = isAdminEmail(u.email);
        profUnsub = fs.onSnapshot(doc("users", u.uid), s => {
          const d = s.data();
          if (!d && admin) fs.setDoc(doc("users", u.uid), { name: "מנהל החנות", email: u.email.toLowerCase(), phone: "", status: "approved", createdAt: Date.now() }).catch(console.warn);
          cb({ uid: u.uid, email: u.email, name: d?.name || "", phone: d?.phone || "", status: admin ? "approved" : (d?.status || "pending"), isAdmin: admin });
        }, e => { console.warn(e); cb({ uid: u.uid, email: u.email, name: "", phone: "", status: admin ? "approved" : "pending", isAdmin: admin }); });
      });
    },
    async signUp({ name, email, phone, password }) {
      const c = await authM.createUserWithEmailAndPassword(auth, email.trim(), password);
      await fs.setDoc(doc("users", c.user.uid), { name, email: email.trim().toLowerCase(), phone, status: isAdminEmail(email) ? "approved" : "pending", createdAt: Date.now() });
    },
    signIn: (e, p) => authM.signInWithEmailAndPassword(auth, e.trim(), p),
    signOut: () => authM.signOut(auth),
    reset: e => authM.sendPasswordResetEmail(auth, e.trim()),
    watchProducts: cb => snapList(col("products"), l => cb(l.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)))),
    async saveProduct(p) { const { id, ...d } = p; if (id) await fs.setDoc(doc("products", id), d, { merge: true }); else await fs.addDoc(col("products"), { ...d, createdAt: Date.now() }); },
    deleteProduct: id => fs.deleteDoc(doc("products", id)),
    watchUsers: cb => snapList(col("users"), cb),
    setUserStatus: (id, status) => fs.updateDoc(doc("users", id), { status }),
    updateUser: (id, p) => fs.updateDoc(doc("users", id), p),
    watchSettings: cb => fs.onSnapshot(doc("settings", "store"), s => cb(s.data() || {}), () => cb({})),
    saveSettings: s => fs.setDoc(doc("settings", "store"), s, { merge: true }),
    createOrder: async o => (await fs.addDoc(col("orders"), { ...o, createdAt: Date.now() })).id,
    watchOrders: cb => snapList(col("orders"), cb),
    watchMyOrders: (uid, cb) => snapList(fs.query(col("orders"), fs.where("uid", "==", uid)), cb),
    updateOrder: (id, p) => fs.updateDoc(doc("orders", id), p),
    deleteOrder: id => fs.deleteDoc(doc("orders", id))
  };
}

let unsubs = [], subKey = "";
function onProfile(p) {
  S.profile = p; S.ready = true;
  const key = p ? `${p.uid}|${p.isAdmin}|${p.status}` : "";
  if (key !== subKey) {
    subKey = key; unsubs.forEach(u => u && u()); unsubs = [];
    S.products = []; S.users = []; S.orders = []; S.myOrders = [];
    if (!p) { S.cart = {}; S.view = "shop"; S.openOrder = null; S.sheet = null; S.tab = "orders"; }
    else if (p.isAdmin) {
      unsubs.push(api.watchProducts(l => { S.products = l; render(); }), api.watchUsers(l => { S.users = l; render(); }), api.watchOrders(l => { S.orders = l.sort((a, b) => b.createdAt - a.createdAt); render(); }));
    } else if (p.status === "approved") {

/* ---------- render ---------- */
let deferred = false;
function render(force) {
  const a = document.activeElement;
  if (!force && a && $app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== "file") { deferred = true; return; }
  deferred = false;
  const y = window.scrollY;
  $app.innerHTML = view();
  window.scrollTo(0, y);
  document.title = S.settings.storeName ? `${S.settings.storeName} · מחירון` : "מחירון הזמנות";
}
$app.addEventListener("focusout", () => setTimeout(() => { if (deferred) render(); }, 0));

function view() {
  if (S.fatal) return `<div class="center wrap"><div class="box">${ico("alert")}<h2>החיבור נכשל</h2><p class="muted">${esc(S.fatal)}</p></div></div>`;
  if (!S.ready) return `<div class="center"><div class="spin"></div></div>`;
  let html = demoBar();
  const p = S.profile;
  if (!p) html += authView();
  else if (p.isAdmin) html += adminView();
  else if (p.status === "rejected") html += msgView("block", "", "החשבון לא אושר", "פנו למנהל החנות לפרטים נוספים.");
  else if (p.status !== "approved") html += msgView("clock", "", "ממתינים לאישור המנהל", `שלום ${esc(p.name || "")}, ההרשמה התקבלה. ברגע שהמנהל יאשר את החשבון, המחירון ייפתח כאן אוטומטית.`);
  else if (S.view === "sent") html += sentView();

function calcPrice(o) {
  const mode = fv("pr_mode", "pct"), raw = parseFloat(fv("pr_val"));

  if (mode === "pct") { const pct = Math.min(100, Math.max(0, raw)); return { mode, pct: r2(pct), final: r2(o.subtotal * (1 - pct / 100)) }; }
  const fin = Math.max(0, raw); return { mode, final: r2(fin), pct: o.subtotal ? r2((1 - fin / o.subtotal) * 100) : 0 };
}

    const ws = XLSX.utils.aoa_to_sheet(sum);
    ws["!cols"] = [{ wch: 9 }, { wch: 16 }, { wch: 20 }, { wch: 14 }, { wch: 8 }, { wch: 12 }, { wch: 8 }, { wch: 12 }, { wch: 12 }, { wch: 30 }];

    orders.forEach(o => (o.items || []).forEach(i => lines.push(["#" + shortId(o.id), o.name, i.name, +i.price, +i.qty, r2(i.price * i.qty)])));

  openCart: () => { S.sheet = "cart"; render(true); },
  closeSheet: () => { S.sheet = null; S.confirm = null; render(true); },
  mine: () => { S.view = "mine"; S.sheet = null; render(true); window.scrollTo(0, 0); },
  toShop: () => { S.view = "shop"; render(true); window.scrollTo(0, 0); },
  sendOrder: () => {
    const items = cartItems(); if (!items.length) return;
    const p = S.profile, subtotal = r2(items.reduce((s, i) => s + i.qty * i.price, 0)), note = fv("c_note").trim();
    run(async () => {
      const id = await api.createOrder({ uid: p.uid, name: p.name, email: p.email, phone: p.phone, items: items.map(({ id, name, price, qty }) => ({ id, name, price, qty })), subtotal, note, status: "new" });
      const text = [`הזמנה חדשה #${shortId(id)}`, `לקוח: ${p.name}`, `טלפון: ${p.phone}`, "", ...items.map(i => `• ${i.name} × ${i.qty} = ${money(i.price * i.qty)}`), "", `סה"כ לפי המחירון: ${money(subtotal)}`, ...(note ? ["", `הערה: ${note}`] : [])].join("\n");
      const url = S.settings.whatsapp ? waLink(S.settings.whatsapp, text) : "";
      S.sent = { id, url }; S.cart = {}; S.f.c_note = ""; S.sheet = null; S.view = "sent";
      if (url) { try { window.open(url, "_blank", "noopener"); } catch (e) {} }
    });
  },
  tab: t => { S.tab = t; S.openOrder = null; S.confirm = null; render(true); },
  ofilter: f => { S.ofilter = f; render(true); },
  openOrder: id => { const o = findOrder(id); if (!o) return; openOrderInit(o); S.openOrder = id; render(true); window.scrollTo(0, 0); },
  closeOrder: () => { S.openOrder = null; S.confirm = null; render(true); },
  prMode: m => { S.f.pr_mode = m; S.f.pr_val = ""; render(true); },
  savePrice: () => {
    const o = findOrder(S.openOrder); if (!o) return;
    const c = calcPrice(o);
    run(() => api.updateOrder(o.id, { status: "priced", finalPrice: c.final, discountPct: c.pct, priceMode: c.mode, adminNote: fv("pr_note").trim(), pricedAt: Date.now() }), "המחיר נשמר. הלקוח כבר רואה אותו ב\"ההזמנות שלי\"");
  },
  ask: what => { S.confirm = what; render(true); },
  noConfirm: () => { S.confirm = null; render(true); },
  delOrderYes: () => { const id = S.openOrder; S.openOrder = null; S.confirm = null; run(() => api.deleteOrder(id), "ההזמנה נמחקה"); },
  pdf: id => { const o = findOrder(id); if (o) run(() => exportPdf(o), "קובץ ה-PDF ירד"); },
  xls: id => { const o = findOrder(id); if (o) run(() => exportXls([o], `הזמנה ${shortId(o.id)} - ${fileSafe(o.name)}.xlsx`), "קובץ האקסל ירד"); },
  xlsAll: () => { const l = S.orders.filter(o => S.ofilter === "all" || o.status === S.ofilter); run(() => exportXls(l.length ? l : S.orders, `הזמנות ${new Date().toLocaleDateString("he-IL").replace(/\./g, "-")}.xlsx`), "קובץ האקסל ירד"); },
  addSamples: () => run(async () => {
    const t = Date.now();
    for (const [k, [name, price, cat, desc, emoji, bg]] of SAMPLE_FOOD.entries())
      await api.saveProduct({ id: "sample_" + (k + 1), name, price, cat, desc, image: svgTile(emoji, bg), sample: true, createdAt: t + k });
  }, `נוספו ${SAMPLE_FOOD.length} מוצרי דוגמה`),
  delSamplesYes: () => { const ids = S.products.filter(p => p.sample).map(p => p.id); S.confirm = null;
    run(async () => { for (const id of ids) await api.deleteProduct(id); }, "מוצרי הדוגמה נמחקו"); },
  newProduct: () => { S.editProduct = "new"; Object.assign(S.f, { p_name: "", p_price: "", p_cat: "", p_desc: "", p_image: "" }); S.confirm = null; S.sheet = "product"; render(true); },
  editProduct: id => { const p = S.products.find(x => x.id === id); if (!p) return; S.editProduct = id; Object.assign(S.f, { p_name: p.name || "", p_price: String(p.price ?? ""), p_cat: p.cat || "", p_desc: p.desc || "", p_image: p.image || "" }); S.confirm = null; S.sheet = "product"; render(true); },
  clearImg: () => { S.f.p_image = ""; render(true); },
  saveProduct: () => {
    const name = fv("p_name").trim(), price = parseFloat(fv("p_price"));
    if (!name || isNaN(price) || price < 0) return toast("צריך שם ומחיר תקין");
    const data = { name, price: r2(price), cat: fv("p_cat").trim(), desc: fv("p_desc").trim(), image: fv("p_image") };
    if (S.editProduct !== "new") data.id = S.editProduct;
    run(async () => { await api.saveProduct(data); S.sheet = null; }, "המוצר נשמר");
  },
  delProductYes: () => { const id = S.editProduct; S.sheet = null; S.confirm = null; run(() => api.deleteProduct(id), "המוצר נמחק"); },
  editUser: id => { const u = S.users.find(x => x.id === id); if (!u) return;
    S.editUser = id; Object.assign(S.f, { u_name: u.name || "", u_phone: u.phone || "", u_note: u.adminNote || "", u_status: u.status || "pending" });
    S.sheet = "customer"; render(true); },
  uStatus: st => { S.f.u_status = st; render(true); },
  saveUser: () => {
    const id = S.editUser, name = fv("u_name").trim(), phone = fv("u_phone").trim();
    if (!name) return toast("צריך שם");
    if (phone.replace(/\D/g, "").length < 9) return toast("מספר הטלפון לא תקין");
    const u = S.users.find(x => x.id === id), mine = S.orders.filter(o => o.uid === id);
    run(async () => {
      await api.updateUser(id, { name, phone, adminNote: fv("u_note").trim(), status: fv("u_status", "pending") });
      if (u && (u.name !== name || u.phone !== phone)) for (const o of mine) await api.updateOrder(o.id, { name, phone });
      S.sheet = null;
    }, "פרטי הלקוח נשמרו");
  },
  approve: id => run(() => api.setUserStatus(id, "approved"), "הלקוח אושר"),
  reject: id => run(() => api.setUserStatus(id, "rejected")),
  clearLogo: () => { S.f.s_logo = ""; render(true); },
  saveSettings: () => run(() => api.saveSettings({ storeName: fv("s_store", S.settings.storeName).trim() || "החנות של אפריים בן דוד", whatsapp: fv("s_wa", S.settings.whatsapp).trim(), logo: fv("s_logo", S.settings.logo) }), "ההגדרות נשמרו"),
  backup: () => run(async () => {
    const data = { app: "mechiron", version: 1, exportedAt: Date.now(), settings: S.settings, products: S.products, users: S.users, orders: S.orders };
    const d = new Date(), name = `גיבוי ${fileSafe(S.settings.storeName)} ${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
    downloadBlob(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }), name);
    await api.saveSettings({ lastBackup: Date.now() });
  }, "קובץ הגיבוי ירד"),
  restoreNo: () => { S.restore = null; render(true); },
  restoreYes: () => { const r = S.restore; if (!r) return; S.restore = null;
    run(async () => {
      for (const p of r.products) { const { id, ...d } = p; if (id && d.name != null) await api.saveProduct({ id, ...d }); }
      if (r.settings) { const { lastBackup, ...st } = r.settings; await api.saveSettings(st); }
    }, `שוחזרו ${r.products.length} מוצרים`); },
  copyLink: () => { const l = location.href.split("#")[0].split("?")[0]; try { navigator.clipboard.writeText(l).then(() => toast("הקישור הועתק"), () => toast("סמנו את הקישור והעתיקו")); } catch (e) { toast("סמנו את הקישור והעתיקו"); } }
};

$app.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) return;
  if (b.classList.contains("scrim") && e.target.closest("[data-stop]")) return;
  e.preventDefault();
  ACT[b.dataset.a] && ACT[b.dataset.a](b.dataset.id, b, e);
});
$app.addEventListener("submit", e => { e.preventDefault(); const k = e.target.dataset.submit; ACT[k] && ACT[k](); });
$app.addEventListener("input", e => {
  const k = e.target.dataset.m; if (!k) return;
  S.f[k] = e.target.value;
  if (k === "pr_val") {
    const o = findOrder(S.openOrder); if (!o) return; const c = calcPrice(o);
    const out = document.getElementById("prOut"), pct = document.getElementById("prPct");
    if (out) out.textContent = money(c.final);
    if (pct) pct.textContent = c.pct > 0 ? `הנחה ${c.pct}%` : c.pct < 0 ? `תוספת ${-c.pct}%` : "ללא הנחה";
  }
});
$app.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "restoreFile" && t.files && t.files[0]) {
    try {
      const j = JSON.parse(await t.files[0].text());
      if (!j || j.app !== "mechiron" || !Array.isArray(j.products)) throw new Error("זה לא קובץ גיבוי של המחירון");
      S.restore = { exportedAt: j.exportedAt, products: j.products, settings: j.settings || null };
    } catch (err) { toast(err instanceof SyntaxError ? "הקובץ פגום ולא ניתן לקרוא אותו" : err.message); }
    return render(true);
  }
  if ((t.id === "pImg" || t.id === "sLogo") && t.files && t.files[0]) {
    try {
      if (t.id === "pImg") S.f.p_image = await compress(t.files[0], 640, "image/jpeg");
      else S.f.s_logo = await compress(t.files[0], 320, "image/png");
    } catch (err) { toast(err.message); }
    render(true);
  }
});
// links inside the app (WhatsApp) must still work: the click handler only intercepts [data-a]

/* ---------- boot ---------- */
(async () => {
  try {
    if (FIREBASE_CONFIG) { S.mode = "live"; api = await firebaseBackend(FIREBASE_CONFIG); }
    else { S.mode = "demo"; api = demoBackend(); }
    api.watchSettings(s => { S.settings = { ...DEFAULT_SETTINGS, ...s }; render(); });
    api.onAuth(onProfile);
  } catch (e) { console.error(e); S.fatal = "לא הצלחתי להתחבר ל-Firebase. בדקו את פרטי FIREBASE_CONFIG. (" + (e.message || e) + ")"; S.ready = true; render(true); }
})();
</script>
</body>
</html>
