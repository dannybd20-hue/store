<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אלוף בגמרא</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#10263A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="אלוף בגמרא">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700;900&display=swap">
<style>
:root{--bg:#F4F1EA;--card:#FFFFFF;--ink:#1A1A1A;--muted:#6B6558;--line:#E2DCCD;--brand:#10263A;--gold:#B8893A;--ok:#1E8A4C;--ok-bg:#E3F4EA;--bad:#C2362F;--bad-bg:#FBE7E5;--warn:#D08A10;--serif:"Frank Ruhl Libre",serif;--body:"Assistant",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E141B;--card:#161E27;--ink:#E9EDF2;--muted:#98A2B3;--line:#2A3646;--brand:#0A1A28;--gold:#D6A955;--ok:#3CCB7A;--ok-bg:#12301F;--bad:#F06A60;--bad-bg:#3A1A18;--warn:#E8A73A}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--brand);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0));display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{margin:0;font:900 22px/1 var(--serif);letter-spacing:0}
header .sc{font-weight:700;font-variant-numeric:tabular-nums;background:rgba(255,255,255,.12);border-radius:8px;padding:4px 12px}
main{max-width:560px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0)) 40px}
.hero{text-align:center;padding:28px 0 8px}
.hero .t{font:900 44px/1.1 var(--serif);color:var(--brand)}
@media (prefers-color-scheme:dark){.hero .t{color:var(--gold)}}
.hero .s{color:var(--muted);margin:8px 0 24px}
.lbl{font-size:15px;color:var(--muted);margin-bottom:8px;text-align:center}
.lvls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:600;text-align:right;display:flex;gap:10px;align-items:center}
.lv b{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--bg);font-weight:700;flex:none}
.lv.on{border:2px solid var(--gold)}
.lv.on b{background:var(--gold);color:#fff}
.lv:last-child{grid-column:1/-1}
.big{display:block;width:100%;background:var(--gold);color:#fff;border:0;border-radius:14px;padding:16px;font:700 20px var(--body)}
.big:active{transform:scale(.98)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-bottom:10px}
.meta b{color:var(--ink)}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar{height:100%;width:100%;background:var(--ok);transition:width 1s linear,background .3s}
.clock{text-align:center;font-weight:700;font-size:18px;margin:8px 0 14px;font-variant-numeric:tabular-nums}
.clock.hot{color:var(--bad)}
.qbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 16px;text-align:center;margin-bottom:16px}
.qbox .p{color:var(--muted);font-size:15px;margin-bottom:6px}
.qbox .w{font:900 40px/1.2 var(--serif)}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:64px;padding:14px 18px;font-size:19px;font-weight:600;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:right}
.opt .ic{width:30px;height:30px;flex:none}
.opt.ok{background:var(--ok-bg);border:2px solid var(--ok);color:var(--ok)}
.opt.bad{background:var(--bad-bg);border:2px solid var(--bad);color:var(--bad)}
.msg{text-align:center;min-height:28px;margin-top:14px;font-weight:700;font-size:18px}
.done{text-align:center;padding:36px 0}
.done .tr{font-size:64px}
.done h2{font:900 30px/1.2 var(--serif);margin:10px 0 6px}
.done p{color:var(--muted);margin:0 0 24px;font-size:18px}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.3)}100%{transform:scale(1)}}.pop{animation:pop .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}.shake{animation:shake .25s 2}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(30,138,76,.0)}50%{box-shadow:0 0 0 6px rgba(30,138,76,.35),0 0 22px 4px rgba(30,138,76,.55)}}
.opt.glow{animation:glow 1s ease-in-out 3;position:relative;z-index:1}
[hidden]{display:none!important}

.field{display:grid;gap:6px;margin-bottom:14px;text-align:right}
.field span{font-size:15px;color:var(--muted);font-weight:600}
.field input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:600 18px var(--body)}
.field input:focus{outline:none;border-color:var(--gold)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 8px;font-weight:700;display:grid;gap:2px}
.seg button small{font-weight:400;color:var(--muted);font-size:13px}
.seg button.on{border:2px solid var(--gold)}
.err{color:var(--bad);font-weight:600;font-size:15px;min-height:22px;text-align:center;margin-bottom:8px}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.pl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:center;opacity:.55;transition:opacity .2s}
.pl.on{opacity:1;border:2px solid var(--gold)}
.pl .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .p{font:900 26px var(--serif);font-variant-numeric:tabular-nums}
.pl .c{font-size:13px;color:var(--muted)}
.turn{text-align:center;padding:48px 0}
.turn .who{font:900 36px/1.2 var(--serif);color:var(--gold);margin:8px 0 24px}
.rank{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px;margin:0 0 22px;text-align:right}
.rank div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:18px}
.rank div:last-child{border:0}
.ghost{display:block;width:100%;margin-top:10px;background:transparent;border:1px solid var(--line);border-radius:14px;padding:14px;font-weight:700}

.lb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:16px}
.lb h3{margin:0 0 6px;font:700 15px var(--body);color:var(--muted);display:flex;justify-content:space-between}
.lb ol{list-style:none;margin:0;padding:0}
.lb li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:16px}
.lb li:first-child{border-top:0}
.lb .md{font-size:20px;width:26px;text-align:center}
.lb .nm{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .pt{font-weight:700;font-variant-numeric:tabular-nums}
.lb li.me{color:var(--gold)}
.lb .empty{color:var(--muted);font-size:15px;padding:4px 0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--brand);color:#fff;border-radius:12px;padding:12px 18px;font-weight:700;z-index:50;box-shadow:0 10px 30px -10px rgba(0,0,0,.4);white-space:nowrap}
.wrap2>div{max-width:560px;margin:0 auto;width:100%}
@media (min-width:900px){.wrap2>div{max-width:none}.opts{grid-template-columns:1fr 1fr;gap:16px}.opt{min-height:120px;font-size:26px;padding:20px 24px;border-radius:18px}.opt .ic{width:38px;height:38px}.qbox{padding:44px 20px}.qbox .w{font-size:56px}.clock{font-size:22px}}
@media (min-width:900px){.wrap2{display:grid;grid-template-columns:280px minmax(0,820px);gap:24px;justify-content:center;max-width:none}.wrap2 .lb{position:sticky;top:20px;align-self:start;order:2}}
</style>
</head>
<body>
<header><h1 style="display:flex;align-items:center;gap:10px"><img src="icon-192.png" alt="" width="34" height="34" style="border-radius:8px">אלוף בגמרא</h1><span class="sc" id="hdr"></span></header>
<main class="wrap2" style="max-width:none">
  <aside class="lb" id="lb"><h3><span>🏆 טבלת האלופים</span><span id="lbst"></span></h3><ol id="lbl"><li class="empty">טוען…</li></ol></aside>
  <div>
  <section id="start">
    <div class="hero"><div class="t">אלוף בגמרא</div><div class="s">30 שניות לכל שאלה</div></div>
    <div class="lbl">סוג משחק</div>
    <div class="seg" id="modes">
      <button data-m="solo" class="on">רגיל<small>שחקן אחד · 10 שאלות בשלב</small></button>
      <button data-m="pp">פינג פונג<small>שני שחקנים · טעית? התור עובר</small></button>
      <button data-m="mp" style="grid-column:1/-1">כל אחד בטלפון שלו<small>2–4 שחקנים · מי שעונה ראשון נכון מקבל את הנקודות</small></button>
    </div>
    <label class="field"><span id="n1l">השם שלך</span><input id="n1" maxlength="20" autocomplete="off" placeholder="משה"></label>
    <label class="field" id="n2f" hidden><span>שחקן 2</span><input id="n2" maxlength="20" autocomplete="off" placeholder="יוסף"></label>
    <div id="tgf" hidden>
      <div class="lbl">מנצח מי שמגיע ראשון ל־</div>
      <div class="seg" id="tg" style="grid-template-columns:1fr 1fr 1fr"><button data-t="5">5 נכונות</button><button data-t="10" class="on">10 נכונות</button><button data-t="15">15 נכונות</button></div>
    </div>
    <div id="mpf" hidden>
      <div class="seg" id="mpm"><button data-x="host" class="on">פתח משחק חדש<small>תקבל קוד לשתף</small></button><button data-x="join">הצטרף למשחק<small>עם קוד מחבר</small></button></div>
      <label class="field" id="codef" hidden><span>קוד המשחק</span><input id="code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="1234" style="letter-spacing:.3em;text-align:center"></label>
    </div>
    <div id="lvlf"><div class="lbl">שלב</div>
    <div class="lvls" id="lvls"></div></div>
    <div class="err" id="err"></div>
    <button class="big" id="go">התחל משחק</button>
  </section>
  <section id="lobby" class="turn" hidden>
    <div class="lbl">קוד המשחק</div>
    <div class="who" id="lcode" style="font-size:56px;letter-spacing:.15em;margin-bottom:6px"></div>
    <div class="lbl" id="lhint"></div>
    <div class="rank" id="lplayers" style="margin-top:16px"></div>
    <div class="err" id="lerr"></div>
    <button class="big" id="lstart" hidden>התחל משחק</button>
    <button class="ghost" id="lleave">יציאה</button>
  </section>
  <section id="turn" class="turn" hidden>
    <div class="lbl" id="turnWhy"></div>
    <div>התור של</div>
    <div class="who" id="turnWho"></div>
    <button class="big" id="turnGo">אני מוכן</button>
  </section>
  <section id="play" hidden>
    <div class="duel" id="duel" hidden>
      <div class="pl" id="pl0"><div class="n"></div><div class="p">0</div><div class="c"></div></div>
      <div class="pl" id="pl1"><div class="n"></div><div class="p">0</div><div class="c"></div></div>
    </div>
    <div class="meta"><span id="lvl"></span><span id="qn"></span></div>
    <div class="track"><div class="bar" id="bar"></div></div>
    <div class="clock" id="clock">30 שניות</div>
    <div class="qbox"><div class="p">מה הפירוש של</div><div class="w" id="q"></div></div>
    <div class="opts" id="opts"></div>
    <div class="msg" id="msg"></div>
    <div class="rank" id="mpb" hidden style="margin-top:14px"></div>
  </section>
  <section id="done" class="done" hidden>
    <div class="tr">🏆</div>
    <h2 id="dt"></h2>
    <p id="ds"></p>
    <div class="rank" id="rank" hidden></div>
    <button class="big" id="next"></button>
    <button class="ghost" id="home">חזרה למסך הראשי</button>
  </section>
  </div>
</main>
<div class="toast" id="toast" hidden></div>

async function knownBest(name){if(name in LB.best)return LB.best[name];

 LB.q[name]=score;if(LB.busy[name])return;LB.busy[name]=true;

 if(s.status==="lobby"){mpLobby();return}
 if(s.status==="q"&&s.item&&s.q!==MP.shown){MP.shown=s.q;mpAsk(s)}
 else if(s.status==="reveal"&&MP.rev!==s.q){MP.rev=s.q;mpReveal(s)}
 else if(s.status==="over"){mpOver(s)}
 if(MP.host&&s.status==="q"){clearTimeout(MP.hostT);const q=s.q;MP.hostT=setTimeout(()=>mpResolve(q),(TIME+2)*1000);mpCheck()}}
let mpAnswered=false,mpT0=0;
function mpAsk(s){show("play");$("duel").hidden=true;$("mpb").hidden=true;$("lvl").textContent="שלב "+level+" · "+NAMES[level];$("qn").textContent="שאלה "+(s.q+1)+" מתוך "+(s.total||MPQ);
 $("q").textContent=s.item.w;$("msg").textContent="";mpAnswered=false;mpT0=performance.now();const box=$("opts");box.innerHTML="";
 (s.item.opts||[]).forEach(o=>{const b=document.createElement("button");b.className="opt";const sp=document.createElement("span");sp.textContent=String(o);b.appendChild(sp);const m=document.createElement("span");m.className="mk";b.appendChild(m);b.onclick=()=>mpPick(b,o===s.item.m,o,s.q);box.appendChild(b)});
 left=TIME;draw();clearInterval(MP.timer);MP.timer=setInterval(()=>{left--;draw();if(left<=5&&left>0)sTick();else if(left>5)sSoft();if(left<=0){clearInterval(MP.timer);if(!mpAnswered){mpAnswered=true;sOver();$("msg").innerHTML="<span style='color:var(--bad)'>נגמר הזמן</span>"}}},1000)}
async function mpPick(b,ok,choice,q){if(mpAnswered)return;mpAnswered=true;const ms=Math.round(performance.now()-mpT0);
 if(ok){sOk();mark(b,true);$("msg").innerHTML="<span style='color:var(--ok)'>נכון! בודקים מי היה הכי מהיר…</span>"}else{sBad();mark(b,false);b.classList.add("shake");curItem={m:MP.st.item.m};showRight();$("msg").innerHTML="<span style='color:var(--bad)'>טעות</span>"}
 try{await MP.db.doc("games/"+MP.code+"/answers/"+q+"-"+MP.me.key).set({q,name:MP.me.name,choice:String(choice),ok,ms})}catch(e){$("msg").textContent=mpErr(e)}}
function mpReveal(s){clearInterval(MP.timer);curItem={m:s.item.m};showRight();const w=s.winner,me=w&&w.name===MP.me.name;
 if(w){if(me)sWin();$("msg").innerHTML="";const sp=document.createElement("span");sp.style.color=me?"var(--ok)":"var(--ink)";sp.textContent=me?"⚡ ענית ראשון! +"+w.pts:"⚡ "+w.name+" ענה ראשון ("+w.sec+" שנ׳) +"+w.pts;$("msg").appendChild(sp)}
 else $("msg").innerHTML="<span style='color:var(--muted)'>אף אחד לא ענה נכון</span>";
 P[0].score=((s.scores||{})[MP.me.key]||{}).score||0;mpBoard(s)}
function mpOver(s){if(!$("done").hidden&&mode==="mp")return;clearInterval(MP.timer);show("done");sWin();const arr=Object.values(s.scores||{}).sort((a,b)=>b.score-a.score);
 $("dt").textContent=arr.length?String(arr[0].name)+" ניצח!":"המשחק נגמר";$("ds").textContent="קוד משחק "+MP.code;
 const r=$("rank");r.hidden=false;r.innerHTML="";arr.forEach((x,i)=>{const d=document.createElement("div");const n=document.createElement("b");n.textContent=["🥇 ","🥈 ","🥉 ",""][Math.min(i,3)]+String(x.name);const t=document.createElement("span");t.textContent=Number(x.score)+" נק׳";d.append(n,t);r.appendChild(d)});
 $("next").textContent=MP.host?"משחק חדש עם אותם שחקנים":"חזרה למסך הראשי"}

</script>
</body>
